name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - 'payroll-frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    paths:
      - 'payroll-frontend/**'
      - '.github/workflows/frontend-ci.yml'

defaults:
  run:
    working-directory: payroll-frontend

jobs:
  build-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: payroll-frontend/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
